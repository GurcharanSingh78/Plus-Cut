name: Build Plus Cut APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK & Release AAB
        run: |
          chmod +x gradlew || true
          gradle assembleDebug bundleRelease

      - name: Upload Debug APK (For Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: PlusCut-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB (For Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: PlusCut-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
